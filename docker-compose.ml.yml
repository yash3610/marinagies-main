services:
  ml-service:
    build:
      context: ./ml-service
    environment:
      ML_SERVICE_KEY: ${ML_SERVICE_KEY:?Set ML_SERVICE_KEY to at least 32 random characters}
      ML_MAX_SAMPLES: 5000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - marineaegis-ml-artifacts:/service/artifacts
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  marineaegis-ml-artifacts:
