name: MarineAegis quality gates
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm test --prefix backend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - run: npm audit --prefix backend --omit=dev --audit-level=critical
      - run: npm audit --prefix frontend --omit=dev --audit-level=critical
  python-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt
      - run: python -m pip install -r ml-service/requirements-dev.txt bandit pip-audit
      - run: python -m pytest ml-service/tests
        env:
          PYTHONPATH: ml-service
          ML_SERVICE_KEY: ci-only-ml-service-key-at-least-32-characters
      - run: bandit -r ml-service/app
      - run: pip-audit -r ml-service/requirements.txt
